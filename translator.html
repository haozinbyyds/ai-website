<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# 注释翻译工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .editor-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .editor-section {
                grid-template-columns: 1fr;
            }
        }

        .editor-column {
            display: flex;
            flex-direction: column;
        }

        .editor-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-label-right {
            font-size: 12px;
            font-weight: normal;
            color: #999;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            line-height: 1.5;
            background: #f8f9fa;
            color: #333;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .progress {
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }

        .success-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2e7d32;
            display: none;
        }

        .error-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #c62828;
            display: none;
        }

        .download-btn {
            background: #4caf50;
            color: white;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }

        .stat-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 C# 注释翻译工具</h1>
        <p class="subtitle">将英文注释自动翻译成中文</p>

        <div class="info-box">
            💡 支持单行注释 (//) 和多行注释 (/* */)</div>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">拖拽 C# 文件到这里</div>
            <div class="upload-hint">或点击选择文件</div>
            <input type="file" id="fileInput" accept=".cs">
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-number" id="totalLines">0</div>
                <div class="stat-label">总行数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="commentCount">0</div>
                <div class="stat-label">注释数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="translatedCount">0</div>
                <div class="stat-label">已翻译</div>
            </div>
        </div>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text"><span id="progressText">0%</span></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">翻译中...</p>
        </div>

        <div class="editor-section">
            <div class="editor-column">
                <div class="editor-label">
                    原始代码
                    <span class="editor-label-right" id="sourceSize">0 B</span>
                </div>
                <textarea id="sourceCode" placeholder="粘贴你的 C# 代码或上传文件..."></textarea>
            </div>
            <div class="editor-column">
                <div class="editor-label">
                    翻译后代码
                    <span class="editor-label-right" id="targetSize">0 B</span>
                </div>
                <textarea id="targetCode" placeholder="翻译后的代码将显示在这里..." readonly></textarea>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="translateBtn">🚀 开始翻译</button>
            <button class="btn-secondary" id="clearBtn">🗑️ 清空</button>
            <button class="btn-secondary download-btn" id="downloadBtn" style="display: none;">⬇️ 下载翻译文件</button>
            <button class="btn-secondary" id="copyBtn">📋 复制代码</button>
        </div>

        <div class="footer">
            <p>© 2026 C# 注释翻译工具 | 使用 Google Translate API</p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const sourceCode = document.getElementById('sourceCode');
        const targetCode = document.getElementById('targetCode');
        const translateBtn = document.getElementById('translateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const loading = document.getElementById('loading');
        const stats = document.getElementById('stats');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');

        let currentFileName = 'translated.cs';
        let commentCache = {};

        // 文件上传处理
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.cs')) {
                handleFile(file);
            } else {
                showError('请上传 .cs 文件');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            currentFileName = file.name.replace('.cs', '.translated.cs');
            const reader = new FileReader();
            reader.onload = (e) => {
                sourceCode.value = e.target.result;
                updateStats();
                downloadBtn.style.display = 'none';
            };
            reader.readAsText(file);
        }

        // 翻译功能
        translateBtn.addEventListener('click', async () => {
            const code = sourceCode.value.trim();
            if (!code) {
                showError('请先输入或上传 C# 代码');
                return;
            }

            translateBtn.disabled = true;
            loading.style.display = 'block';
            progress.style.display = 'block';
            errorBox.style.display = 'none';

            try {
                const translated = await translateCode(code);
                targetCode.value = translated;
                downloadBtn.style.display = 'inline-block';
                updateStats();
                showSuccess('翻译完成！');
            } catch (error) {
                showError(`翻译失败: ${error.message}`);
            } finally {
                translateBtn.disabled = false;
                loading.style.display = 'none';
                progress.style.display = 'none';
            }
        });

        async function translateCode(code) {
            // 提取所有注释
            const comments = extractComments(code);
            const totalComments = comments.length;
            let translatedCount = 0;

            // 翻译每个注释
            for (let i = 0; i < comments.length; i++) {
                const comment = comments[i];
                
                // 检查缓存
                if (commentCache[comment.text]) {
                    comments[i].translated = commentCache[comment.text];
                } else {
                    // 调用翻译 API
                    const translated = await translateText(comment.text);
                    comments[i].translated = translated;
                    commentCache[comment.text] = translated;
                }

                translatedCount++;
                updateProgress((translatedCount / totalComments) * 100);

                // 避免 API 限制
                await sleep(100);
            }

            // 替换代码中的注释
            let result = code;
            comments.forEach(comment => {
                result = result.replace(comment.original, comment.replacedText || 
                    (comment.type === 'single' ? `// ${comment.translated}` : `/* ${comment.translated} */`));
            });

            return result;
        }

        function extractComments(code) {
            const comments = [];
            const lines = code.split('\n');

            lines.forEach((line, lineIndex) => {
                // 单行注释
                const singleMatch = line.match(/\/\/\s*(.+)$/);
                if (singleMatch) {
                    const text = singleMatch[1].trim();
                    if (text && !isChineseOnly(text)) {
                        comments.push({
                            type: 'single',
                            original: singleMatch[0],
                            text: text,
                            translated: text,
                            replacedText: `// ${text}`
                        });
                    }
                }
            });

            // 多行注释
            const multiPattern = /\/\*\s*([\s\S]*?)\s*\*\//g;
            let match;
            while ((match = multiPattern.exec(code)) !== null) {
                const text = match[1].trim();
                if (text && !isChineseOnly(text)) {
                    comments.push({
                        type: 'multi',
                        original: match[0],
                        text: text,
                        translated: text,
                        replacedText: `/* ${text} */`
                    });
                }
            }

            return comments;
        }

        async function translateText(text) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-CN`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.responseStatus === 200 && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return text;
            } catch (error) {
                console.warn('翻译 API 错误:', error);
                return text;
            }
        }

        function isChineseOnly(text) {
            return /^[\u4e00-\u9fa5\s，。！？；：]+$/.test(text);
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressText.textContent = Math.round(percent) + '%';
        }

        function updateStats() {
            const code = targetCode.value || sourceCode.value;
            const lines = code.split('\n').length;
            const comments = extractComments(code);
            const translated = comments.filter(c => c.translated && c.translated !== c.text).length;

            document.getElementById('totalLines').textContent = lines;
            document.getElementById('commentCount').textContent = comments.length;
            document.getElementById('translatedCount').textContent = translated;

            stats.style.display = 'grid';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 其他按钮
        clearBtn.addEventListener('click', () => {
            sourceCode.value = '';
            targetCode.value = '';
            downloadBtn.style.display = 'none';
            stats.style.display = 'none';
            commentCache = {};
            hideMessages();
        });

        copyBtn.addEventListener('click', () => {
            targetCode.select();
            document.execCommand('copy');
            showSuccess('已复制到剪贴板！');
        });

        downloadBtn.addEventListener('click', () => {
            const text = targetCode.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFileName;
            a.click();
            window.URL.revokeObjectURL(url);
        });

        sourceCode.addEventListener('input', () => {
            document.getElementById('sourceSize').textContent = formatSize(sourceCode.value.length);
        });

        targetCode.addEventListener('input', () => {
            document.getElementById('targetSize').textContent = formatSize(targetCode.value.length);
        });

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
            setTimeout(() => {
                errorBox.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successBox.textContent = message;
            successBox.style.display = 'block';
            setTimeout(() => {
                successBox.style.display = 'none';
            }, 3000);
        }

        function hideMessages() {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
        }
    </script>
</body>
</html>
